name: Social Preview Diagnostic

on:
  push:
    branches:
      - agent/social-preview-spec-pass

permissions:
  contents: write

jobs:
  convert-image:
    if: ${{ !contains(github.event.head_commit.message, '[rgb-converted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/social-preview-spec-pass
      - name: Convert share image to truecolor RGB PNG
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          p='plot-twisted-share.png'
          im=Image.open(p).convert('RGB')
          assert im.size == (1200, 630), im.size
          im.save(p, format='PNG', optimize=True)
          print('saved', p, im.size, im.mode)
          PY
          file plot-twisted-share.png
      - name: Commit converted image
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plot-twisted-share.png
          git commit -m 'Convert social preview to RGB [rgb-converted]'
          git push origin HEAD:agent/social-preview-spec-pass

  inspect-production:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch production HTML as LinkedIn crawler
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://plot-twisted.netlify.app/'
          curl -L --fail-with-body -A 'LinkedInBot/1.0' -D page-headers.txt "$URL" -o page.html
          echo '=== PAGE RESPONSE HEADERS ==='
          cat page-headers.txt
          echo '=== SOCIAL META TAGS ==='
          grep -Eio '<(meta|link)[^>]+(og:|twitter:|canonical)[^>]*>' page.html || true

      - name: Fetch production share image as LinkedIn crawler
        shell: bash
        run: |
          set -euxo pipefail
          IMG='https://plot-twisted.netlify.app/plot-twisted-share.png'
          curl -L --fail-with-body -A 'LinkedInBot/1.0' -D image-headers.txt "$IMG" -o share.png
          echo '=== IMAGE RESPONSE HEADERS ==='
          cat image-headers.txt
          file share.png
          sha256sum share.png
          python3 - <<'PY'
          import struct
          with open('share.png','rb') as f:
              assert f.read(8) == b'\x89PNG\r\n\x1a\n'
              length=struct.unpack('>I', f.read(4))[0]
              assert f.read(4) == b'IHDR'
              data=f.read(length)
          w,h,bit_depth,color_type,comp,flt,interlace=struct.unpack('>IIBBBBB', data)
          print(f'PNG width={w} height={h} bit_depth={bit_depth} color_type={color_type}')
          PY
