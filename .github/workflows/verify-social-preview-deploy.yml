name: Verify Social Preview Deploy

on:
  push:
    branches:
      - agent/social-preview-spec-pass

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/social-preview-spec-pass
      - name: Verify deploy-preview social image bytes
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet pillow
          PREVIEW='https://deploy-preview-16--plot-twisted.netlify.app/plot-twisted-share.png'
          curl -L --fail-with-body -A 'LinkedInBot/1.0' -D preview-image-headers.txt "$PREVIEW" -o preview-share.png
          cat preview-image-headers.txt
          echo '=== LOCAL / REMOTE HASHES ==='
          sha256sum plot-twisted-share.png preview-share.png
          test "$(sha256sum plot-twisted-share.png | cut -d' ' -f1)" = "$(sha256sum preview-share.png | cut -d' ' -f1)"
          python3 - <<'PY'
          from PIL import Image
          for p in ('plot-twisted-share.png','preview-share.png'):
              im=Image.open(p)
              im.load()
              print(p, im.size, im.mode, im.format)
              assert im.size == (1200, 630)
              assert im.mode == 'RGB'
              assert im.format == 'PNG'
          PY
