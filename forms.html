<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Plot Twisted Forms</title></head>
<body hidden>
  <form name="support" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="support">
    <p><label>Leave blank: <input name="bot-field"></label></p>
    <label>What do you need help with?<select name="type"><option>Gameplay problem</option><option>Install or PWA</option><option>Accessibility</option><option>Data or privacy question</option><option>Other</option></select></label>
    <label>What happened?<textarea name="message"></textarea></label>
    <label>Contact (optional)<input name="contact"></label>
  </form>
</body>
</html>
