<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Plot Twisted social preview</title>
  <desc id="desc">Plot Twisted PT icon, category icons, and a phone mockup showing a superhero movie clue.</desc>
  <defs>
    <radialGradient id="pinkGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 155) rotate(36) scale(430 390)">
      <stop stop-color="#ff4d8d" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ff4d8d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1070 90) rotate(125) scale(350 310)">
      <stop stop-color="#e4b34c" stop-opacity=".19"/>
      <stop offset="1" stop-color="#e4b34c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pt" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff4d8d"/>
      <stop offset="1" stop-color="#e4b34c"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7a202b"/>
      <stop offset="1" stop-color="#4a1017"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".65"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0d090a"/>
  <rect width="1200" height="630" fill="url(#pinkGlow)"/>
  <rect width="1200" height="630" fill="url(#goldGlow)"/>
  <path d="M0 629.5H1200" stroke="#e4b34c" stroke-opacity=".55"/>

  <g transform="translate(58 42)">
    <rect x="0" y="0" width="58" height="58" rx="13" fill="url(#pt)" filter="url(#shadow)"/>
    <rect x="3" y="3" width="52" height="52" rx="11" fill="none" stroke="#fff8ee" stroke-opacity=".65"/>
    <text x="29" y="37" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900">PT</text>
    <image href="https://plot-twisted.netlify.app/icon-192.png" x="0" y="0" width="58" height="58" preserveAspectRatio="xMidYMid slice"/>
    <text x="74" y="25" fill="#fff8ee" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">PLOT TWISTED</text>
    <text x="74" y="48" fill="#e4b34c" font-family="monospace" font-size="10" letter-spacing="1.3">A NOBODY CREATIVE PRODUCTION</text>
  </g>

  <g transform="translate(58 145)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#fff8ee" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="900" letter-spacing="-2">MOVIE PLOTS.</text>
    <text x="0" y="64" dominant-baseline="hanging" fill="#ff4d8d" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="900" letter-spacing="-2">TWISTED BEYOND</text>
    <text x="0" y="128" dominant-baseline="hanging" fill="#ff4d8d" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="900" letter-spacing="-2">RECOGNITION.</text>
    <rect x="0" y="198" width="470" height="5" rx="2.5" fill="#ff4d8d"/>
    <text x="0" y="240" fill="#b9aaa0" font-family="Arial, Helvetica, sans-serif" font-size="21">Guess the movie from one ridiculous summary.</text>
    <text x="0" y="270" fill="#b9aaa0" font-family="Arial, Helvetica, sans-serif" font-size="21">Five clues. Six showings. No account required.</text>

    <g transform="translate(0 314)" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, Arial" font-size="22" text-anchor="middle">
      <g><rect width="54" height="54" rx="15" fill="#21171a" stroke="#49373c"/><text x="27" y="35">🧸</text></g>
      <g transform="translate(66 0)"><rect width="54" height="54" rx="15" fill="#301922" stroke="#ff4d8d" stroke-opacity=".5"/><text x="27" y="35">🦸</text></g>
      <g transform="translate(132 0)"><rect width="54" height="54" rx="15" fill="#21171a" stroke="#49373c"/><text x="27" y="35">🚀</text></g>
      <g transform="translate(198 0)"><rect width="54" height="54" rx="15" fill="#21171a" stroke="#49373c"/><text x="27" y="35">🐉</text></g>
      <g transform="translate(264 0)"><rect width="54" height="54" rx="15" fill="#21171a" stroke="#49373c"/><text x="27" y="35">💔</text></g>
      <g transform="translate(330 0)"><rect width="54" height="54" rx="15" fill="#21171a" stroke="#49373c"/><text x="27" y="35">📱</text></g>
    </g>

    <rect x="0" y="396" width="230" height="49" rx="15" fill="#ff4d8d"/>
    <text x="25" y="428" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800">PLAY FREE  →</text>
    <text x="0" y="468" fill="#806f68" font-family="monospace" font-size="12" letter-spacing="1.2">MOVIE TRIVIA, TOLD BADLY.</text>
  </g>

  <g transform="translate(855 24) rotate(4 145 285)" filter="url(#shadow)">
    <rect x="0" y="0" width="290" height="580" rx="43" fill="#030303" stroke="#50484b" stroke-width="3"/>
    <rect x="10" y="10" width="270" height="560" rx="35" fill="#171113"/>
    <rect x="106" y="22" width="78" height="20" rx="10" fill="#000"/>

    <g transform="translate(25 52)">
      <rect width="27" height="27" rx="6" fill="url(#pt)"/>
      <text x="13.5" y="18" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="900">PT</text>
      <image href="https://plot-twisted.netlify.app/icon-192.png" x="0" y="0" width="27" height="27" preserveAspectRatio="xMidYMid slice"/>
      <text x="37" y="18" fill="#fff8ee" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">PLOT TWISTED</text>
      <rect x="196" y="2" width="49" height="22" rx="11" fill="#301922"/>
      <text x="220.5" y="16" text-anchor="middle" fill="#ff92b9" font-family="monospace" font-size="7">SCORE 0</text>
    </g>

    <rect x="10" y="91" width="270" height="34" fill="#120d0f"/>
    <text x="25" y="112" fill="#ff92b9" font-family="monospace" font-size="8">🦸 SUPERHERO</text>
    <text x="226" y="112" fill="#806f68" font-family="monospace" font-size="8">SEAT 1/5</text>

    <rect x="24" y="143" width="242" height="177" rx="13" fill="#080b0e" stroke="#3d4851" stroke-width="2"/>
    <text x="145" y="170" text-anchor="middle" fill="#e4b34c" font-family="monospace" font-size="8" letter-spacing="1">NOW PLAYING</text>
    <text x="145" y="202" text-anchor="middle" fill="#e7edf2" font-family="Arial, Helvetica, sans-serif" font-size="14">
      <tspan x="145" dy="0">Billionaire builds a weapon</tspan>
      <tspan x="145" dy="21">in a cave, rebrands himself</tspan>
      <tspan x="145" dy="21">as the weapon, and calls it</tspan>
      <tspan x="145" dy="21">personal growth.</tspan>
    </text>

    <rect x="24" y="336" width="242" height="39" rx="8" fill="#21171a" stroke="#49373c"/>
    <text x="145" y="360" text-anchor="middle" fill="#806f68" font-family="monospace" font-size="8">NAME THE MOVIE</text>
    <rect x="24" y="387" width="116" height="38" rx="8" fill="#ff4d8d"/>
    <text x="82" y="411" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800">REVEAL</text>
    <rect x="150" y="387" width="116" height="38" rx="8" fill="#21171a" stroke="#49373c"/>
    <text x="208" y="411" text-anchor="middle" fill="#b9aaa0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800">NEW CLUE</text>

    <g fill="url(#key)" stroke="#8f2938" stroke-width=".7" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="800" text-anchor="middle">
      <g transform="translate(25 447)">
        <rect x="0" y="0" width="20" height="28" rx="5"/><rect x="24" y="0" width="20" height="28" rx="5"/><rect x="48" y="0" width="20" height="28" rx="5"/><rect x="72" y="0" width="20" height="28" rx="5"/><rect x="96" y="0" width="20" height="28" rx="5"/><rect x="120" y="0" width="20" height="28" rx="5"/><rect x="144" y="0" width="20" height="28" rx="5"/><rect x="168" y="0" width="20" height="28" rx="5"/><rect x="192" y="0" width="20" height="28" rx="5"/><rect x="216" y="0" width="20" height="28" rx="5"/>
        <text x="10" y="18" fill="#fff8ee">Q</text><text x="34" y="18" fill="#fff8ee">W</text><text x="58" y="18" fill="#fff8ee">E</text><text x="82" y="18" fill="#fff8ee">R</text><text x="106" y="18" fill="#fff8ee">T</text><text x="130" y="18" fill="#fff8ee">Y</text><text x="154" y="18" fill="#fff8ee">U</text><text x="178" y="18" fill="#fff8ee">I</text><text x="202" y="18" fill="#fff8ee">O</text><text x="226" y="18" fill="#fff8ee">P</text>
      </g>
      <g transform="translate(37 481)">
        <rect x="0" y="0" width="22" height="28" rx="5"/><rect x="26" y="0" width="22" height="28" rx="5"/><rect x="52" y="0" width="22" height="28" rx="5"/><rect x="78" y="0" width="22" height="28" rx="5"/><rect x="104" y="0" width="22" height="28" rx="5"/><rect x="130" y="0" width="22" height="28" rx="5"/><rect x="156" y="0" width="22" height="28" rx="5"/><rect x="182" y="0" width="22" height="28" rx="5"/><rect x="208" y="0" width="22" height="28" rx="5"/>
        <text x="11" y="18" fill="#fff8ee">A</text><text x="37" y="18" fill="#fff8ee">S</text><text x="63" y="18" fill="#fff8ee">D</text><text x="89" y="18" fill="#fff8ee">F</text><text x="115" y="18" fill="#fff8ee">G</text><text x="141" y="18" fill="#fff8ee">H</text><text x="167" y="18" fill="#fff8ee">J</text><text x="193" y="18" fill="#fff8ee">K</text><text x="219" y="18" fill="#fff8ee">L</text>
      </g>
      <g transform="translate(63 515)">
        <rect x="0" y="0" width="24" height="28" rx="5"/><rect x="28" y="0" width="24" height="28" rx="5"/><rect x="56" y="0" width="24" height="28" rx="5"/><rect x="84" y="0" width="24" height="28" rx="5"/><rect x="112" y="0" width="24" height="28" rx="5"/><rect x="140" y="0" width="24" height="28" rx="5"/><rect x="168" y="0" width="24" height="28" rx="5"/>
        <text x="12" y="18" fill="#fff8ee">Z</text><text x="40" y="18" fill="#fff8ee">X</text><text x="68" y="18" fill="#fff8ee">C</text><text x="96" y="18" fill="#fff8ee">V</text><text x="124" y="18" fill="#fff8ee">B</text><text x="152" y="18" fill="#fff8ee">N</text><text x="180" y="18" fill="#fff8ee">M</text>
      </g>
    </g>
    <rect x="61" y="552" width="68" height="23" rx="6" fill="#21171a"/>
    <rect x="137" y="552" width="68" height="23" rx="6" fill="#21171a"/>
    <rect x="213" y="552" width="52" height="23" rx="6" fill="#e4b34c"/>
    <text x="95" y="567" text-anchor="middle" fill="#b9aaa0" font-family="Arial, Helvetica, sans-serif" font-size="7">HINT</text>
    <text x="171" y="567" text-anchor="middle" fill="#b9aaa0" font-family="Arial, Helvetica, sans-serif" font-size="7">SPACE</text>
    <text x="239" y="567" text-anchor="middle" fill="#2c1705" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="800">ENTER</text>
  </g>

  <circle cx="708" cy="563" r="3" fill="#e4b34c"/>
  <circle cx="750" cy="563" r="3" fill="#e4b34c"/>
  <circle cx="792" cy="563" r="3" fill="#e4b34c"/>
</svg>
